services:
  - type: web
    name: attendex-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: attendex-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: attendex-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: attendex-db
          property: password

databases:
  - name: attendex-db
    plan: free
    region: oregon
    databaseName: attendex_db
