services:
  - type: web
    name: attendex-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: attendex-db
          property: connectionString

databases:
  - name: attendex-db
    plan: free
    region: oregon
    databaseName: attendex_db
