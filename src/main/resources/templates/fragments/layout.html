<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Reusable header fragment: includes CSS, Bootstrap, and meta tags -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Attendex'">Attendex</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Top Navigation Bar -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <svg width="30" height="30" viewBox="0 0 32 32" class="me-2">
                <circle cx="16" cy="16" r="14" fill="white" opacity="0.2"/>
                <path d="M10 16l4 4 8-8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="fw-bold tracking-wide">Attendex</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link text-white-50 hover-text-white" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50 hover-text-white" th:href="@{/#features}">Features</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50 hover-text-white" th:href="@{/#about}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50 hover-text-white" th:href="@{/#contact}">Contact</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <!-- Logged In State -->
                <li class="nav-item me-3" sec:authorize="isAuthenticated()"
                    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <span class="text-white small d-inline-flex align-items-center">
                        <i class="bi bi-person-circle fs-5 me-2"></i>
                        <span>Signed in as <strong sec:authentication="name">User</strong></span>
                    </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()"
                    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                </li>

                <!-- Logged Out State -->
                <li class="nav-item" sec:authorize="isAnonymous()"
                    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <a class="btn btn-light btn-sm px-4 rounded-pill text-primary fw-semibold" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Alert Messages Fragment -->
<div th:fragment="alerts" class="container mt-3">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="bg-white text-center text-muted py-4 mt-5 border-top">
    <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-center">
            <div class="d-flex align-items-center text-dark fw-bold">
                <svg width="24" height="24" viewBox="0 0 32 32" class="me-2">
                    <circle cx="16" cy="16" r="14" fill="#0d6efd" opacity="0.2"/>
                    <path d="M10 16l4 4 8-8" stroke="#0d6efd" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Attendex</span>
            </div>
            <p class="mb-0 text-muted small">&copy; 2026 Attendex — Java Full Stack Attendance Management System. All rights reserved.</p>
            <div>
                <a th:href="@{/login}" class="text-muted small text-decoration-none me-3">Login</a>
                <a th:href="@{/#contact}" class="text-muted small text-decoration-none">Support</a>
            </div>
        </div>
    </div>
</footer>

<!-- Scripts Fragment -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</div>

</body>
</html>
