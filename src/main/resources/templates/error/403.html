<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <div class="mb-4">
            <span style="font-size: 6rem;" class="text-danger">
                <i class="bi bi-shield-lock-fill"></i>
            </span>
        </div>
        <h1 class="display-3 fw-bold text-danger mb-2">403</h1>
        <h4 class="fw-bold text-dark mb-3">Access Denied</h4>
        <p class="text-muted mb-4 fs-5">
            You don't have permission to access this page.<br>
            Please contact your administrator if you believe this is a mistake.
        </p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg rounded-pill px-4">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </a>
            <a th:href="@{/}" class="btn btn-primary btn-lg rounded-pill px-4">
                <i class="bi bi-house me-2"></i>Home
            </a>
        </div>
        <p class="text-muted small mt-4">
            Logged in as:
            <strong sec:authentication="name" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">User</strong>
        </p>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
