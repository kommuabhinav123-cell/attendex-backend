<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Attendance History & Filter')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1"><i class="bi bi-calendar3 text-primary me-2"></i>Attendance Session History</h3>
            <p class="text-muted small mb-0">View, filter, and audit all recorded attendance periods.</p>
        </div>
        <a th:href="@{/faculty/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
    </div>

    <!-- Filters Card -->
    <div class="card shadow-sm border-0 mb-4 rounded-4">
        <div class="card-body p-4">
            <form th:action="@{/faculty/sessions}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Subject</label>
                    <select name="subjectId" class="form-select form-select-sm">
                        <option value="">-- All Subjects --</option>
                        <option th:each="a : ${assignments}" th:value="${a.subject.id}"
                                th:text="${a.subject.name + ' (' + a.subject.code + ')'}"
                                th:selected="${selectedSubjectId != null and selectedSubjectId == a.subject.id}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Class Section</label>
                    <select name="classSectionId" class="form-select form-select-sm">
                        <option value="">-- All Sections --</option>
                        <option th:each="a : ${assignments}" th:value="${a.classSection.id}"
                                th:text="${a.classSection.name}"
                                th:selected="${selectedClassSectionId != null and selectedClassSectionId == a.classSection.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">From Date</label>
                    <input type="date" name="startDate" class="form-control form-control-sm" th:value="${startDate}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">To Date</label>
                    <input type="date" name="endDate" class="form-control form-control-sm" th:value="${endDate}">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm flex-grow-1">Filter</button>
                    <a th:href="@{/faculty/sessions}" class="btn btn-outline-secondary btn-sm">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Sessions Table -->
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small text-muted">
                        <tr>
                            <th class="ps-4">Date</th>
                            <th>Subject</th>
                            <th>Class Section</th>
                            <th>Period</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${sessions}">
                            <td class="ps-4 fw-semibold text-dark" th:text="${s.sessionDate}"></td>
                            <td th:text="${s.subject.name}"></td>
                            <td th:text="${s.classSection.name}"></td>
                            <td><span class="badge bg-light text-dark border" th:text="'Period ' + ${s.sessionNumber}"></span></td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${s.status.name() == 'OPEN'} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${s.status}"></span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/faculty/attendance/view/{id}(id=${s.id})}" class="btn btn-outline-primary btn-sm rounded-pill">
                                    <i class="bi bi-eye me-1"></i> View / Edit
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(sessions)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                                No attendance sessions matched the selected criteria.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
