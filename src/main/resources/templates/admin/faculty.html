<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Faculty')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid py-4 px-lg-5">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1"><i class="bi bi-person-badge text-success me-2"></i>Faculty Directory</h3>
            <p class="text-muted small mb-0">Manage teaching faculty members, departmental designations, and teaching assignments.</p>
        </div>
        <div class="d-flex gap-2 mt-3 mt-md-0">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
            <a th:href="@{/admin/faculty/add}" class="btn btn-success"><i class="bi bi-person-plus me-1"></i> Add Faculty</a>
        </div>
    </div>

    <!-- Faculty Table -->
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small text-muted">
                        <tr>
                            <th class="ps-4">User ID</th>
                            <th>Employee ID</th>
                            <th>Faculty Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f : ${facultyList}">
                            <td class="ps-4">
                                <span class="badge bg-secondary-subtle text-dark border font-monospace fw-bold" th:text="'#' + ${f.user.id}">#1</span>
                            </td>
                            <td class="fw-semibold text-dark" th:text="${f.employeeId}"></td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${f.user.fullName}"></div>
                            </td>
                            <td><code class="text-success fw-bold" th:text="${f.user.username}"></code></td>
                            <td class="text-muted" th:text="${f.user.email}"></td>
                            <td th:text="${f.department != null ? f.department.name : '-'}"></td>
                            <td><span class="badge bg-light text-dark border" th:text="${f.designation != null ? f.designation : '-'}"></span></td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${f.active} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${f.active} ? 'Active' : 'Inactive'"></span>
                            </td>
                            <td class="text-end pe-4">
                                <form th:if="${f.active}" th:action="@{/admin/faculty/{id}/deactivate(id=${f.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Deactivate" onclick="return confirm('Deactivate faculty member?')">
                                        <i class="bi bi-person-x"></i> Deactivate
                                    </button>
                                </form>
                                <form th:unless="${f.active}" th:action="@{/admin/faculty/{id}/activate(id=${f.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-success" title="Activate" onclick="return confirm('Activate faculty member?')">
                                        <i class="bi bi-person-check"></i> Activate
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(facultyList)}">
                            <td colspan="9" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                                No faculty members found. Click "Add Faculty" to register a faculty account.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
