<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Attendance Reports')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3 class="mb-3"><i class="bi bi-file-earmark-bar-graph"></i> Attendance Reports</h3>
    <div class="card shadow-sm border-0">
        <div class="card-header bg-info text-white"><h6 class="mb-0">Export Attendance Report (CSV)</h6></div>
        <div class="card-body">
            <form th:action="@{/admin/reports/download}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Class Section *</label>
                    <select name="classSectionId" class="form-select" required>
                        <option value="">-- Select --</option>
                        <option th:each="cs : ${sections}" th:value="${cs.id}" th:text="${cs.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Subject *</label>
                    <select name="subjectId" class="form-select" required>
                        <option value="">-- Select --</option>
                        <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name + ' (' + s.code + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Start Date *</label>
                    <input type="date" name="startDate" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">End Date *</label>
                    <input type="date" name="endDate" class="form-control" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-info text-white w-100"><i class="bi bi-download"></i> Download CSV</button>
                </div>
            </form>
        </div>
    </div>
    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Back</a>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
