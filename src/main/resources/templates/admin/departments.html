<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Departments')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3 class="mb-3"><i class="bi bi-building"></i> Departments</h3>
    <div class="row">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-warning text-dark"><h6 class="mb-0">Add Department</h6></div>
                <div class="card-body">
                    <form th:action="@{/admin/departments/add}" method="post">
                        <div class="mb-2"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" required></div>
                        <div class="mb-2"><label class="form-label">Code *</label><input type="text" name="code" class="form-control" required placeholder="e.g. CSE"></div>
                        <div class="mb-2"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
                        <button type="submit" class="btn btn-warning"><i class="bi bi-plus-lg"></i> Create</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Description</th><th>Status</th></tr></thead>
                        <tbody>
                            <tr th:each="d : ${departments}">
                                <td><span class="badge bg-primary" th:text="${d.code}"></span></td>
                                <td th:text="${d.name}"></td>
                                <td th:text="${d.description ?: '-'}"></td>
                                <td><span class="badge" th:classappend="${d.active} ? 'bg-success' : 'bg-secondary'" th:text="${d.active} ? 'Active' : 'Inactive'"></span></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(departments)}"><td colspan="4" class="text-center text-muted">No departments</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Back</a>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
