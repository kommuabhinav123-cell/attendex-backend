<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Courses')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3 class="mb-3"><i class="bi bi-book"></i> Courses</h3>
    <div class="row">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-info text-white"><h6 class="mb-0">Add Course</h6></div>
                <div class="card-body">
                    <form th:action="@{/admin/courses/add}" method="post">
                        <div class="mb-2"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" required></div>
                        <div class="mb-2"><label class="form-label">Code *</label><input type="text" name="code" class="form-control" required placeholder="e.g. BTECH-CS"></div>
                        <div class="mb-2"><label class="form-label">Duration (years) *</label><input type="number" name="duration" class="form-control" min="1" max="6" value="4" required></div>
                        <div class="mb-2">
                            <label class="form-label">Department *</label>
                            <select name="departmentId" class="form-select" required>
                                <option value="">-- Select --</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-info text-white"><i class="bi bi-plus-lg"></i> Create</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Duration</th><th>Department</th></tr></thead>
                        <tbody>
                            <tr th:each="c : ${courses}">
                                <td><span class="badge bg-info" th:text="${c.code}"></span></td>
                                <td th:text="${c.name}"></td>
                                <td th:text="${c.duration + ' years'}"></td>
                                <td th:text="${c.department.name}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(courses)}"><td colspan="4" class="text-center text-muted">No courses</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Back</a>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
