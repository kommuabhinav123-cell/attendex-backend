<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Student')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="bi bi-person-plus"></i> Add Student</h5></div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/students/add}" th:object="${student}" method="post">
                        <h6 class="text-muted fw-bold mb-3"><i class="bi bi-person me-1"></i> Account Information</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name *</label>
                                <input type="text" th:field="*{fullName}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Roll Number *</label>
                                <input type="text" th:field="*{rollNumber}" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Username *</label>
                                <input type="text" th:field="*{username}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password *</label>
                                <input type="password" th:field="*{password}" class="form-control" required minlength="6">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Confirm Password *</label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" required>
                            </div>
                        </div>

                        <h6 class="text-muted fw-bold mb-3 mt-2"><i class="bi bi-mortarboard me-1"></i> Academic Details</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Student Year *</label>
                                <select th:field="*{enrollmentYear}" class="form-select" required>
                                    <option value="1">Year 1 (1st Year)</option>
                                    <option value="2">Year 2 (2nd Year)</option>
                                    <option value="3">Year 3 (3rd Year)</option>
                                    <option value="4">Year 4 (4th Year)</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Department *</label>
                                <select th:field="*{departmentId}" class="form-select" required>
                                    <option value="">-- Select Department --</option>
                                    <option th:each="d : ${departments}" th:value="${d.id}"
                                            th:text="${d.name + ' (' + d.code + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Class Section *</label>
                                <select th:field="*{classSectionId}" class="form-select" required>
                                    <option value="">-- Select Section --</option>
                                    <option th:each="cs : ${classSections}" th:value="${cs.id}"
                                            th:text="${cs.name + ' (Year ' + cs.year + ', Sem ' + cs.semester + ')'}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- Parent/Guardian Information -->
                        <hr class="my-3">
                        <h6 class="text-muted fw-bold mb-3"><i class="bi bi-people me-1"></i> Parent/Guardian Information</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Parent Name</label>
                                <input type="text" th:field="*{parentName}" class="form-control"
                                       placeholder="e.g. Mr. Ramesh Kumar">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Parent Email</label>
                                <input type="email" th:field="*{parentEmail}" class="form-control"
                                       placeholder="parent@email.com">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Parent Phone *</label>
                                <input type="tel" th:field="*{parentPhone}" class="form-control"
                                       placeholder="e.g. 9876543210" pattern="[0-9]{10}"
                                       title="Enter 10-digit mobile number" required>
                                <div class="form-text text-muted">SMS absence alerts go to this number.</div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Add Student</button>
                            <a th:href="@{/admin/students}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
