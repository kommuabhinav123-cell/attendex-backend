<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Faculty')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-person-plus me-2"></i>Add Faculty Member</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/faculty/add}" th:object="${faculty}" method="post">
                        <h6 class="text-muted fw-bold mb-3"><i class="bi bi-person me-1"></i> Personal &amp; Login Details</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Full Name *</label>
                                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Dr. John Doe" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Employee ID *</label>
                                <input type="text" th:field="*{employeeId}" class="form-control" placeholder="FAC-1001" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Username *</label>
                                <input type="text" th:field="*{username}" class="form-control" placeholder="johndoe" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="johndoe@college.edu" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Password *</label>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required minlength="6">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">Designation</label>
                                <input type="text" th:field="*{designation}" class="form-control" placeholder="e.g. Associate Professor">
                            </div>
                        </div>

                        <h6 class="text-muted fw-bold mb-3 mt-2"><i class="bi bi-building me-1"></i> Department &amp; Class Section Assignment</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label small fw-semibold">Department *</label>
                                <select th:field="*{departmentId}" class="form-select" required>
                                    <option value="">-- Select Department --</option>
                                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name + ' (' + d.code + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label small fw-semibold">Class Section (Optional)</label>
                                <select th:field="*{classSectionId}" class="form-select">
                                    <option value="">-- None / Assign Later --</option>
                                    <option th:each="cs : ${classSections}" th:value="${cs.id}"
                                            th:text="${cs.name + ' (Year ' + cs.year + ', Sem ' + cs.semester + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label small fw-semibold">Teaching Subject (Optional)</label>
                                <select th:field="*{subjectId}" class="form-select">
                                    <option value="">-- None / Assign Later --</option>
                                    <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name + ' (' + s.code + ')'}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-3 d-flex gap-2">
                            <button type="submit" class="btn btn-success px-4"><i class="bi bi-check-lg me-1"></i> Register Faculty</button>
                            <a th:href="@{/admin/faculty}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
