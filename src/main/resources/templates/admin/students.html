<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Students')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid py-4 px-lg-5">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1"><i class="bi bi-mortarboard text-primary me-2"></i>Students Directory</h3>
            <p class="text-muted small mb-0">Manage registered students, view academic enrollments, and control account access.</p>
        </div>
        <div class="d-flex gap-2 mt-3 mt-md-0">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
            <a th:href="@{/admin/students/add}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i> Add Student</a>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="card shadow-sm border-0 mb-4 rounded-3">
        <div class="card-body p-3">
            <form th:action="@{/admin/students}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="search" class="form-control border-start-0"
                               th:value="${search}" placeholder="Search students by roll number, name, or email...">
                    </div>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">Search</button>
                    <a th:href="@{/admin/students}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Students Table -->
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-uppercase small text-muted">
                        <tr>
                            <th class="ps-4">Roll No</th>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Class Section</th>
                            <th>Year</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${students}">
                            <td class="ps-4 fw-semibold text-dark" th:text="${s.rollNumber}"></td>
                            <td>
                                <div class="fw-bold" th:text="${s.user.fullName}"></div>
                            </td>
                            <td><code th:text="${s.user.username}"></code></td>
                            <td class="text-muted" th:text="${s.user.email}"></td>
                            <td th:text="${s.department != null ? s.department.name : '-'}"></td>
                            <td>
                                <span th:if="${s.classSection != null}" class="badge bg-secondary-subtle text-dark" th:text="${s.classSection.name}"></span>
                                <span th:unless="${s.classSection != null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <span class="badge bg-primary-subtle text-primary fw-semibold"
                                      th:text="${s.enrollmentYear <= 4 ? 'Year ' + s.enrollmentYear : s.enrollmentYear}">Year 1</span>
                            </td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${s.active} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${s.active} ? 'Active' : 'Inactive'"></span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/admin/students/{id}/edit(id=${s.id})}" class="btn btn-outline-primary" title="Edit Student">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:if="${s.active}" th:action="@{/admin/students/{id}/deactivate(id=${s.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-danger" title="Deactivate" onclick="return confirm('Deactivate student account?')">
                                            <i class="bi bi-person-x"></i>
                                        </button>
                                    </form>
                                    <form th:unless="${s.active}" th:action="@{/admin/students/{id}/activate(id=${s.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-success" title="Activate" onclick="return confirm('Activate student account?')">
                                            <i class="bi bi-person-check"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="9" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                                No student records found.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
