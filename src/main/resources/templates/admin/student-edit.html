<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Student')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Student Profile</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/students/{id}/edit(id=${student.id})}" th:object="${student}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Full Name *</label>
                                <input type="text" th:field="*{fullName}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Roll Number *</label>
                                <input type="text" th:field="*{rollNumber}" class="form-control" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Student Year *</label>
                                <select th:field="*{enrollmentYear}" class="form-select" required>
                                    <option value="1">Year 1 (1st Year)</option>
                                    <option value="2">Year 2 (2nd Year)</option>
                                    <option value="3">Year 3 (3rd Year)</option>
                                    <option value="4">Year 4 (4th Year)</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Department</label>
                                <select th:field="*{departmentId}" class="form-select">
                                    <option value="">-- No Department --</option>
                                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name + ' (' + d.code + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Class Section</label>
                                <select th:field="*{classSectionId}" class="form-select">
                                    <option value="">-- No Section --</option>
                                    <option th:each="cs : ${classSections}" th:value="${cs.id}" th:text="${cs.name + ' (Year ' + cs.year + ', Sem ' + cs.semester + ')'}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- Parent/Guardian Information for Absence Alerts -->
                        <div class="border-top pt-3 mb-4">
                            <h6 class="text-primary fw-bold mb-3"><i class="bi bi-people me-1"></i> Parent / Guardian Contact (for Absence SMS)</h6>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Parent Name</label>
                                    <input type="text" th:field="*{parentName}" class="form-control" placeholder="Parent / Guardian Name">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Parent Email</label>
                                    <input type="email" th:field="*{parentEmail}" class="form-control" placeholder="parent@example.com">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Parent Phone (for SMS) *</label>
                                    <input type="tel" th:field="*{parentPhone}" class="form-control" placeholder="10-digit mobile number" pattern="[0-9]{10}">
                                    <div class="form-text text-muted small">SMS alerts are dispatched when student is marked ABSENT.</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/students}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
