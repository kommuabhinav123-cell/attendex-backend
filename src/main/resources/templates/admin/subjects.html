<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Subjects')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3 class="mb-3"><i class="bi bi-journal-text"></i> Subjects</h3>
    <div class="row">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-header bg-success text-white"><h6 class="mb-0">Add Subject</h6></div>
                <div class="card-body">
                    <form th:action="@{/admin/subjects/add}" method="post">
                        <div class="mb-2"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" required></div>
                        <div class="mb-2"><label class="form-label">Code *</label><input type="text" name="code" class="form-control" required placeholder="e.g. CS301"></div>
                        <div class="mb-2"><label class="form-label">Credits *</label><input type="number" name="credits" class="form-control" min="1" max="10" value="3" required></div>
                        <div class="mb-2"><label class="form-label">Semester *</label><input type="number" name="semester" class="form-control" min="1" max="12" value="1" required></div>
                        <div class="mb-2">
                            <label class="form-label">Course *</label>
                            <select name="courseId" class="form-select" required>
                                <option value="">-- Select --</option>
                                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.name + ' (' + c.code + ')'}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success"><i class="bi bi-plus-lg"></i> Create</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Credits</th><th>Semester</th><th>Course</th></tr></thead>
                        <tbody>
                            <tr th:each="s : ${subjects}">
                                <td><span class="badge bg-success" th:text="${s.code}"></span></td>
                                <td th:text="${s.name}"></td>
                                <td th:text="${s.credits}"></td>
                                <td th:text="${s.semester}"></td>
                                <td th:text="${s.course.name}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(subjects)}"><td colspan="5" class="text-center text-muted">No subjects</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Back</a>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
