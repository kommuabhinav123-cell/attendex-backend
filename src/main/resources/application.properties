# ============================================
# Attendex - Application Configuration
# ============================================
spring.application.name=Attendex

# ---- Server Configuration ----
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true

# ---- Database Configuration ----
# Dynamic multi-database support (PostgreSQL on Render, MySQL locally, H2 fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/attendex_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate Settings ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ---- Thymeleaf Settings ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Logging ----
logging.level.root=INFO
logging.level.com.attendex=DEBUG
logging.level.org.springframework.security=INFO

# ---- Attendex Custom Settings ----
# Minimum attendance percentage before warning is shown
attendex.min-attendance-percentage=75
# Whether student self-registration is enabled (false = admin-managed credentials only)
attendex.student-registration-enabled=false
# College name shown in SMS messages
attendex.college-name=Attendex Institution

# ---- SMS Notification Settings ----
# Set to true to send real SMS via gateway API (false = log to console only)
attendex.sms.enabled=false
# SMS Gateway API URL (e.g., Fast2SMS: https://www.fast2sms.com/dev/bulkV2)
attendex.sms.api-url=
# Your SMS provider API key
attendex.sms.api-key=
# Sender ID registered with your SMS provider
attendex.sms.sender-id=ATTNDX
